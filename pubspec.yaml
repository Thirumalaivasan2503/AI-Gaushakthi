name: indigenous_livestock_app
description: AI-Based Indigenous Livestock Breed Recommendation System for Sustainable Farming.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation & Routing
  go_router: ^13.0.0

  # State Management & Dependency Injection
  flutter_riverpod: ^2.4.9

  # Typography & Aesthetics
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # Utility & Equatable
  equatable: ^2.0.5
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/illustrations/
